# Production Docker Compose: Next.js 15+ Standalone + Drizzle ORM + PostgreSQL 17 + Valkey
version: '3.8'

services:
  web:
    image: myorg/nextjs-app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://next_user:${DB_PASSWORD}@postgres:5432/next_prod
      - VALKEY_URL=redis://valkey:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://app.example.com
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: next_prod
      POSTGRES_USER: next_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next_user -d next_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - valkeydata:/data

volumes:
  pgdata:
  valkeydata:
