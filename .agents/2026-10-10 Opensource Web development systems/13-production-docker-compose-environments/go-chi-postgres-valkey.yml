# Production Docker Compose: Go 1.23+ Chi Microservice + PostgreSQL 17 + Valkey
version: '3.8'

services:
  api:
    image: myorg/go-microservice:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://go_user:${DB_PASSWORD}@postgres:5432/go_prod?sslmode=disable
      - VALKEY_URL=valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: go_prod
      POSTGRES_USER: go_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_user -d go_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - valkeydata:/data

volumes:
  pgdata:
  valkeydata:
