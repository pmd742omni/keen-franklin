<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Procedural Voxel Botanical Studio | Silicon Sanctuary</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-sakura: #f472b6;
      --accent-ginkgo: #facc15;
      --accent-pine: #22c55e;
      --accent-succulent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }

    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Floating UI Controls */
    .studio-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .studio-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .studio-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .studio-subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .control-val {
      color: var(--accent-sakura);
      font-family: monospace;
      font-size: 11px;
    }

    select, input[type="range"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
    }

    input[type="range"] {
      padding: 0;
      cursor: pointer;
      accent-color: var(--accent-sakura);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ec4899, #db2777);
      border: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4);
    }

    /* Stats HUD */
    .hud-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 11px;
      font-family: monospace;
      color: #94a3b8;
    }

    .top-nav {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .nav-link {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: #cbd5e1;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
  </style>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Navigation -->
  <div class="top-nav">
    <a href="/evolution" class="nav-link">🏛️ Evolution Portal</a>
    <a href="/" class="nav-link">🏙️ Simulation Metropolis</a>
  </div>

  <!-- Studio Panel -->
  <div class="studio-panel">
    <div class="studio-header">
      <span style="font-size: 24px;">🌸</span>
      <div>
        <div class="studio-title">Voxel Botanical Studio</div>
        <div class="studio-subtitle">Open-Source Procedural Flora Generator</div>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">Species Archetype</div>
      <select id="speciesSelect" onchange="regenerateFlora()">
        <option value="sakura">🌸 Japanese Sakura (Cherry Blossom)</option>
        <option value="ginkgo">🍂 Golden Ginkgo (Autumn Fan)</option>
        <option value="bonsai">🌲 Scots Pine (Twisted Bonsai)</option>
        <option value="succulent">🪴 Rosette Succulent (Phyllotaxis)</option>
        <option value="willow">🍃 Weeping Willow (Space Colonization)</option>
      </select>
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>L-System Depth / Iterations</span>
        <span class="control-val" id="iterVal">3</span>
      </div>
      <input type="range" id="iterRange" min="1" max="4" value="3" oninput="updateIter(this.value)" onchange="regenerateFlora()" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>Branch Angle Jitter</span>
        <span class="control-val" id="angleVal">28°</span>
      </div>
      <input type="range" id="angleRange" min="15" max="45" value="28" oninput="updateAngle(this.value)" onchange="regenerateFlora()" />
    </div>

    <div class="control-group">
      <div class="control-label">
        <span>Foliage Billow Radius</span>
        <span class="control-val" id="foliageVal">4</span>
      </div>
      <input type="range" id="foliageRange" min="2" max="6" value="4" oninput="updateFoliage(this.value)" onchange="regenerateFlora()" />
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="regenerateFlora()">🎲 Reseed Flora</button>
      <button class="btn" onclick="exportVoxData()">💾 Export .VOX</button>
    </div>
  </div>

  <!-- Stats HUD -->
  <div class="hud-badge" id="hudStats">
    Rendering: 0 Voxels • Single Instanced Draw Call • 60 FPS
  </div>

  <script>
    // -------------------------------------------------------------------------
    // 1. Color Palettes
    // -------------------------------------------------------------------------
    const PALETTES = {
      sakura: {
        bark: ['#2c1b18', '#422b26', '#593c35'],
        foliageCore: ['#ec4899', '#db2777'],
        foliageMid: ['#f472b6', '#f43f5e'],
        foliageRim: ['#fbcfe8', '#fdf2f8', '#ffffff']
      },
      ginkgo: {
        bark: ['#3b2f2f', '#54433d', '#6e594f'],
        foliageCore: ['#d97706', '#b45309'],
        foliageMid: ['#eab308', '#ca8a04'],
        foliageRim: ['#facc15', '#fef08a', '#fef9c3']
      },
      bonsai: {
        bark: ['#1f1917', '#382e2b', '#4e3f3a'],
        foliageCore: ['#14532d', '#0f3a20'],
        foliageMid: ['#166534', '#15803d'],
        foliageRim: ['#22c55e', '#4ade80', '#86efac']
      },
      succulent: {
        bark: ['#1e293b', '#334155'],
        foliageCore: ['#065f46', '#047857'],
        foliageMid: ['#10b981', '#34d399'],
        foliageRim: ['#f43f5e', '#fb7185', '#fda4af']
      },
      willow: {
        bark: ['#2e2520', '#453830', '#5c4c42'],
        foliageCore: ['#166534', '#15803d'],
        foliageMid: ['#22c55e', '#4ade80'],
        foliageRim: ['#86efac', '#bbf7d0', '#dcfce7']
      }
    };

    // -------------------------------------------------------------------------
    // 2. Three.js Scene Setup
    // -------------------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e14);
    scene.fog = new THREE.FogExp2(0x0a0e14, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(25, 20, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 10, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
    sunLight.position.set(40, 60, 30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    // Stone Pedestal
    const pedestalGeo = new THREE.CylinderGeometry(14, 16, 2, 32);
    const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestal.position.y = -1;
    pedestal.receiveShadow = true;
    scene.add(pedestal);

    const gridHelper = new THREE.GridHelper(60, 30, 0x334155, 0x1e293b);
    gridHelper.position.y = -2;
    scene.add(gridHelper);

    let activeInstancedMesh = null;
    let currentVoxelData = [];

    // -------------------------------------------------------------------------
    // 3. Procedural Voxel Botanical Generator
    // -------------------------------------------------------------------------
    function generateFloraVoxels(species, iterations, angleDeg, foliageRadius) {
      const palette = PALETTES[species] || PALETTES.sakura;
      const voxels = new Map();

      if (species === 'succulent') {
        // Vogel Phyllotaxis Spiral
        const goldenAngle = 137.507764 * (Math.PI / 180);
        const numPetals = 70;
        const scale = 0.85;

        for (let n = 0; n < numPetals; n++) {
          const theta = n * goldenAngle;
          const r = scale * Math.sqrt(n);
          const z = Math.pow(n / numPetals, 1.6) * 5.0;

          const petalLen = Math.max(2, Math.floor(2 + (n / numPetals) * 4));
          const petalWidth = Math.max(1, Math.floor(1 + (n / numPetals) * 2));

          for (let l = 0; l < petalLen; l++) {
            const currR = r + l;
            const px = Math.round(currR * Math.cos(theta));
            const py = Math.round(z + (l / petalLen) * 1.5);
            const pz = Math.round(currR * Math.sin(theta));

            for (let w = -petalWidth; w <= petalWidth; w++) {
              const wx = px + Math.round(w * -Math.sin(theta));
              const wz = pz + Math.round(w * Math.cos(theta));
              const key = `${wx},${py},${wz}`;

              let col = palette.foliageCore[0];
              if (l >= petalLen - 1) col = palette.foliageRim[0];
              else if (l >= Math.floor(petalLen / 2)) col = palette.foliageMid[0];

              voxels.set(key, { x: wx, y: py, z: wz, color: col });
            }
          }
        }
      } else if (species === 'willow') {
        // Space Colonization Algorithm for Weeping Willow
        const numAttractors = 120;
        const attractors = [];
        for (let i = 0; i < numAttractors; i++) {
          const theta = Math.random() * Math.PI * 2;
          const rad = 4.0 + Math.random() * 14.0;
          const y = 14.0 + Math.random() * 8.0 - Math.pow(rad / 18.0, 2) * 5.0;
          attractors.push([rad * Math.cos(theta), y, rad * Math.sin(theta)]);
        }

        const nodes = [];
        for (let y = 0; y <= 12; y += 2) nodes.push([0, y, 0]);
        const parentMap = new Map();
        for (let i = 1; i < nodes.length; i++) parentMap.set(i, i - 1);
        parentMap.set(0, null);

        const dKill = 3.0, dInfluence = 15.0, stepLen = 2.2;
        let survivingAttractors = attractors;

        for (let iter = 0; iter < iterations * 3; iter++) {
          if (!survivingAttractors.length) break;
          const nodeAttractors = new Map();
          const nextSurviving = [];

          for (const att of survivingAttractors) {
            let closestIdx = -1, minDist = Infinity;
            for (let i = 0; i < nodes.length; i++) {
              const d = Math.hypot(att[0] - nodes[i][0], att[1] - nodes[i][1], att[2] - nodes[i][2]);
              if (d < minDist) { minDist = d; closestIdx = i; }
            }
            if (minDist > dKill) {
              nextSurviving.push(att);
              if (minDist < dInfluence) {
                if (!nodeAttractors.has(closestIdx)) nodeAttractors.set(closestIdx, []);
                nodeAttractors.get(closestIdx).push(att);
              }
            }
          }
          survivingAttractors = nextSurviving;

          const newNodes = [];
          for (const [idx, atts] of nodeAttractors.entries()) {
            const curr = nodes[idx];
            let dir = [0, 0, 0];
            for (const a of atts) {
              const d = Math.hypot(a[0] - curr[0], a[1] - curr[1], a[2] - curr[2]);
              if (d > 0) {
                dir[0] += (a[0] - curr[0]) / d;
                dir[1] += (a[1] - curr[1]) / d;
                dir[2] += (a[2] - curr[2]) / d;
              }
            }
            dir[1] -= 0.18; // Weeping gravity
            const norm = Math.hypot(dir[0], dir[1], dir[2]);
            if (norm > 0) {
              const nextNode = [
                curr[0] + (dir[0] / norm) * stepLen,
                curr[1] + (dir[1] / norm) * stepLen,
                curr[2] + (dir[2] / norm) * stepLen
              ];
              newNodes.push([nodes.length + newNodes.length, nextNode, idx]);
            }
          }

          if (!newNodes.length) break;
          for (const [nIdx, nPos, pIdx] of newNodes) {
            nodes.push(nPos);
            parentMap.set(nIdx, pIdx);
          }
        }

        // Branch cylinders
        for (const [cIdx, pIdx] of parentMap.entries()) {
          if (pIdx !== null) {
            const p1 = nodes[pIdx], p2 = nodes[cIdx];
            const dist = Math.hypot(p2[0]-p1[0], p2[1]-p1[1], p2[2]-p1[2]);
            const steps = Math.ceil(dist * 2);
            const rad = Math.max(1, Math.round((1.0 - p1[1]/24.0) * 2.0));
            for (let s = 0; s <= steps; s++) {
              const t = s / steps;
              const cx = Math.round(p1[0] + (p2[0]-p1[0])*t);
              const cy = Math.round(p1[1] + (p2[1]-p1[1])*t);
              const cz = Math.round(p1[2] + (p2[2]-p1[2])*t);
              for (let rx = -rad; rx <= rad; rx++) {
                for (let ry = -rad; ry <= rad; ry++) {
                  for (let rz = -rad; rz <= rad; rz++) {
                    if (rx*rx + ry*ry + rz*rz <= rad*rad) {
                      const key = `${cx+rx},${cy+ry},${cz+rz}`;
                      const barkCol = palette.bark[Math.floor(Math.random() * palette.bark.length)];
                      voxels.set(key, { x: cx+rx, y: cy+ry, z: cz+rz, color: barkCol });
                    }
                  }
                }
              }
            }
          }
        }

        // Weeping Tendrils
        const parentSet = new Set(Array.from(parentMap.values()).filter(p => p !== null));
        for (let i = 0; i < nodes.length; i++) {
          if (!parentSet.has(i)) {
            const pt = nodes[i];
            const cascadeLen = 6 + Math.floor(Math.random() * 8);
            const cx = Math.round(pt[0]), cy = Math.round(pt[1]), cz = Math.round(pt[2]);
            for (let drop = 0; drop < cascadeLen; drop++) {
              const wx = cx + Math.round(Math.sin(drop * 0.5) * 1.2);
              const wz = cz + Math.round(Math.cos(drop * 0.5) * 1.2);
              const wy = cy - drop;
              const key = `${wx},${wy},${wz}`;
              let col = palette.foliageCore[0];
              if (drop > cascadeLen / 2) col = palette.foliageRim[Math.floor(Math.random()*palette.foliageRim.length)];
              else if (drop > cascadeLen / 4) col = palette.foliageMid[Math.floor(Math.random()*palette.foliageMid.length)];
              voxels.set(key, { x: wx, y: wy, z: wz, color: col });
            }
          }
        }
      } else {
        // 3D L-System Branching
        let axiom = 'F';
        const rules = ['F[+F]F[-F][&F]', 'F[&F]F[^F][+F]', 'F[+F]F[-F]'];
        for (let i = 0; i < iterations; i++) {
          let next = '';
          for (const ch of axiom) {
            next += (ch === 'F') ? rules[Math.floor(Math.random() * rules.length)] : ch;
          }
          axiom = next;
        }

        const angle = angleDeg * (Math.PI / 180);
        let pos = [0, 0, 0];
        let h = [0, 1, 0];
        let l = [1, 0, 0];
        let u = [0, 0, 1];
        let radius = 2.4;
        const segLen = 4.5;
        const stack = [];
        const endpoints = [];

        function rotate2D(v1, v2, a) {
          const ca = Math.cos(a), sa = Math.sin(a);
          return [
            [v1[0]*ca + v2[0]*sa, v1[1]*ca + v2[1]*sa, v1[2]*ca + v2[2]*sa],
            [-v1[0]*sa + v2[0]*ca, -v1[1]*sa + v2[1]*ca, -v1[2]*sa + v2[2]*ca]
          ];
        }

        for (const ch of axiom) {
          if (ch === 'F') {
            const nextPos = [pos[0] + h[0]*segLen, pos[1] + h[1]*segLen, pos[2] + h[2]*segLen];
            const dist = Math.hypot(nextPos[0]-pos[0], nextPos[1]-pos[1], nextPos[2]-pos[2]);
            const steps = Math.ceil(dist * 2);
            for (let s = 0; s <= steps; s++) {
              const t = s / steps;
              const cx = Math.round(pos[0] + (nextPos[0]-pos[0])*t);
              const cy = Math.round(pos[1] + (nextPos[1]-pos[1])*t);
              const cz = Math.round(pos[2] + (nextPos[2]-pos[2])*t);
              const rInt = Math.max(1, Math.round(radius));

              for (let rx = -rInt; rx <= rInt; rx++) {
                for (let ry = -rInt; ry <= rInt; ry++) {
                  for (let rz = -rInt; rz <= rInt; rz++) {
                    if (rx*rx + ry*ry + rz*rz <= rInt*rInt) {
                      const key = `${cx+rx},${cy+ry},${cz+rz}`;
                      const barkCol = palette.bark[Math.floor(Math.random() * palette.bark.length)];
                      voxels.set(key, { x: cx+rx, y: cy+ry, z: cz+rz, color: barkCol });
                    }
                  }
                }
              }
            }
            pos = nextPos;
            radius = Math.max(0.7, radius * 0.8);
          } else if (ch === '+') [h, l] = rotate2D(h, l, angle);
          else if (ch === '-') [h, l] = rotate2D(h, l, -angle);
          else if (ch === '&') [h, u] = rotate2D(h, u, angle);
          else if (ch === '^') [h, u] = rotate2D(h, u, -angle);
          else if (ch === '[') stack.push({ pos: [...pos], h: [...h], l: [...l], u: [...u], radius });
          else if (ch === ']') {
            endpoints.push([...pos]);
            if (stack.length) {
              const st = stack.pop();
              pos = st.pos; h = st.h; l = st.l; u = st.u; radius = st.radius;
            }
          }
        }

        // Foliage Billows at Endpoints
        for (const ep of endpoints) {
          const r = foliageRadius;
          const cx = Math.round(ep[0]), cy = Math.round(ep[1]), cz = Math.round(ep[2]);

          for (let dx = -r; dx <= r; dx++) {
            for (let dy = -r; dy <= r; dy++) {
              for (let dz = -r; dz <= r; dz++) {
                const dSq = (dx*dx)/(r*r) + (dy*dy)/((r*0.8)*(r*0.8)) + (dz*dz)/(r*r);
                const noise = Math.sin(dx*1.8) * Math.cos(dz*1.8) * 0.25;
                if (dSq + noise <= 1.0) {
                  const key = `${cx+dx},${cy+dy},${cz+dz}`;
                  if (!voxels.has(key)) {
                    let col = palette.foliageCore[0];
                    if (dSq > 0.7) col = palette.foliageRim[Math.floor(Math.random()*palette.foliageRim.length)];
                    else if (dSq > 0.35) col = palette.foliageMid[Math.floor(Math.random()*palette.foliageMid.length)];
                    voxels.set(key, { x: cx+dx, y: cy+dy, z: cz+dz, color: col });
                  }
                }
              }
            }
          }
        }
      }

      return Array.from(voxels.values());
    }

    // -------------------------------------------------------------------------
    // 4. Render Instanced Voxels
    // -------------------------------------------------------------------------
    function regenerateFlora() {
      const species = document.getElementById('speciesSelect').value;
      const iters = parseInt(document.getElementById('iterRange').value, 10);
      const angle = parseInt(document.getElementById('angleRange').value, 10);
      const foliage = parseInt(document.getElementById('foliageRange').value, 10);

      currentVoxelData = generateFloraVoxels(species, iters, angle, foliage);

      if (activeInstancedMesh) {
        scene.remove(activeInstancedMesh);
        activeInstancedMesh.geometry.dispose();
        activeInstancedMesh.material.dispose();
      }

      const count = currentVoxelData.length;
      const boxGeo = new THREE.BoxGeometry(0.85, 0.85, 0.85);
      const boxMat = new THREE.MeshStandardMaterial({ roughness: 0.65, metalness: 0.1 });
      activeInstancedMesh = new THREE.InstancedMesh(boxGeo, boxMat, count);
      activeInstancedMesh.castShadow = true;
      activeInstancedMesh.receiveShadow = true;

      const dummy = new THREE.Object3D();
      const color = new THREE.Color();

      currentVoxelData.forEach((vox, i) => {
        dummy.position.set(vox.x * 0.85, vox.y * 0.85, vox.z * 0.85);
        dummy.updateMatrix();
        activeInstancedMesh.setMatrixAt(i, dummy.matrix);

        color.set(vox.color);
        activeInstancedMesh.setColorAt(i, color);
      });

      activeInstancedMesh.instanceMatrix.needsUpdate = true;
      if (activeInstancedMesh.instanceColor) activeInstancedMesh.instanceColor.needsUpdate = true;

      scene.add(activeInstancedMesh);

      document.getElementById('hudStats').textContent = 
        `Rendering: ${count.toLocaleString()} Voxels • Single Instanced Draw Call • 60 FPS`;
    }

    // -------------------------------------------------------------------------
    // 5. Binary MagicaVoxel .VOX Exporter (Zero Dependencies)
    // -------------------------------------------------------------------------
    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      return [
        parseInt(hex.substring(0, 2), 16),
        parseInt(hex.substring(2, 4), 16),
        parseInt(hex.substring(4, 6), 16)
      ];
    }

    function exportVoxData() {
      if (!currentVoxelData.length) return;
      const species = document.getElementById('speciesSelect').value;

      // Coordinate normalization
      let minX = Infinity, minY = Infinity, minZ = Infinity;
      let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
      currentVoxelData.forEach(v => {
        if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
        if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
        if (v.z < minZ) minZ = v.z; if (v.z > maxZ) maxZ = v.z;
      });

      const sizeX = Math.min(256, maxX - minX + 1);
      const sizeY = Math.min(256, maxY - minY + 1);
      const sizeZ = Math.min(256, maxZ - minZ + 1);

      // Color mapping
      const uniqueColors = Array.from(new Set(currentVoxelData.map(v => v.color))).slice(0, 254);
      const colorMap = new Map();
      uniqueColors.forEach((c, idx) => colorMap.set(c, idx + 1));

      // 1. SIZE Chunk (12 bytes content + 12 header)
      const sizeBuffer = new ArrayBuffer(12 + 12);
      const sizeView = new DataView(sizeBuffer);
      sizeView.setUint8(0, 83); sizeView.setUint8(1, 73); sizeView.setUint8(2, 90); sizeView.setUint8(3, 69); // 'SIZE'
      sizeView.setUint32(4, 12, true);
      sizeView.setUint32(8, 0, true);
      sizeView.setUint32(12, sizeX, true);
      sizeView.setUint32(16, sizeZ, true); // Swap Y and Z for MagicaVoxel
      sizeView.setUint32(20, sizeY, true);

      // 2. XYZI Chunk (4 + N * 4 bytes + 12 header)
      const numVoxels = currentVoxelData.length;
      const xyziContentSize = 4 + numVoxels * 4;
      const xyziBuffer = new ArrayBuffer(12 + xyziContentSize);
      const xyziView = new DataView(xyziBuffer);
      xyziView.setUint8(0, 88); xyziView.setUint8(1, 89); xyziView.setUint8(2, 90); xyziView.setUint8(3, 73); // 'XYZI'
      xyziView.setUint32(4, xyziContentSize, true);
      xyziView.setUint32(8, 0, true);
      xyziView.setUint32(12, numVoxels, true);

      let offset = 16;
      currentVoxelData.forEach(v => {
        const vx = Math.max(0, Math.min(255, v.x - minX));
        const vy = Math.max(0, Math.min(255, v.z - minZ));
        const vz = Math.max(0, Math.min(255, v.y - minY));
        const palIdx = colorMap.get(v.color) || 1;
        xyziView.setUint8(offset++, vx);
        xyziView.setUint8(offset++, vy);
        xyziView.setUint8(offset++, vz);
        xyziView.setUint8(offset++, palIdx);
      });

      // 3. RGBA Palette Chunk (1024 bytes content + 12 header)
      const rgbaBuffer = new ArrayBuffer(12 + 1024);
      const rgbaView = new DataView(rgbaBuffer);
      rgbaView.setUint8(0, 82); rgbaView.setUint8(1, 71); rgbaView.setUint8(2, 66); rgbaView.setUint8(3, 65); // 'RGBA'
      rgbaView.setUint32(4, 1024, true);
      rgbaView.setUint32(8, 0, true);

      let palOffset = 12;
      for (let i = 0; i < 256; i++) {
        if (i < uniqueColors.length) {
          const rgb = hexToRgb(uniqueColors[i]);
          rgbaView.setUint8(palOffset++, rgb[0]);
          rgbaView.setUint8(palOffset++, rgb[1]);
          rgbaView.setUint8(palOffset++, rgb[2]);
          rgbaView.setUint8(palOffset++, 255);
        } else {
          rgbaView.setUint8(palOffset++, 0);
          rgbaView.setUint8(palOffset++, 0);
          rgbaView.setUint8(palOffset++, 0);
          rgbaView.setUint8(palOffset++, 255);
        }
      }

      // 4. MAIN Chunk (8 byte VOX header + 12 byte MAIN header)
      const childrenTotalSize = sizeBuffer.byteLength + xyziBuffer.byteLength + rgbaBuffer.byteLength;
      const mainHeaderBuffer = new ArrayBuffer(8 + 12);
      const mainView = new DataView(mainHeaderBuffer);
      mainView.setUint8(0, 86); mainView.setUint8(1, 79); mainView.setUint8(2, 88); mainView.setUint8(3, 32); // 'VOX '
      mainView.setUint32(4, 150, true); // Version 150
      mainView.setUint8(8, 77); mainView.setUint8(9, 65); mainView.setUint8(10, 73); mainView.setUint8(11, 78); // 'MAIN'
      mainView.setUint32(12, 0, true);
      mainView.setUint32(16, childrenTotalSize, true);

      // Trigger instant download
      const blob = new Blob([mainHeaderBuffer, sizeBuffer, xyziBuffer, rgbaBuffer], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${species}_botanical_voxel.vox`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function updateIter(val) { document.getElementById('iterVal').textContent = val; }
    function updateAngle(val) { document.getElementById('angleVal').textContent = `${val}°`; }
    function updateFoliage(val) { document.getElementById('foliageVal').textContent = val; }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (activeInstancedMesh) {
        activeInstancedMesh.rotation.y += 0.002;
      }
      renderer.render(scene, camera);
    }

    regenerateFlora();
    animate();
  </script>
</body>
</html>
